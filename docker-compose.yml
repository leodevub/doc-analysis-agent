services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db

  ui:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: python -m streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0